<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Heroes Lore: Zero</title>
    <link rel="icon" href="/icon.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0f1a;
        --panel: #161a2b;
        --accent: #ffcf4d;
        --text: #e8eaf2;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: radial-gradient(1200px 800px at 50% -10%, #1c2140, #0d0f1a 70%);
        color: #e8eaf2;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #app {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 18px 12px 28px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        text-align: left;
      }
      header img { image-rendering: pixelated; border-radius: 8px; }
      header h1 { margin: 0; font-size: 20px; letter-spacing: 0.3px; }
      header p { margin: 2px 0 0; font-size: 12px; opacity: 0.7; }
      #stage {
        position: relative;
        width: min(96vw, 760px);
        height: min(78vh, 620px);
        background: #000;
        border: 1px solid #2a2f4a;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #stage > .cheerpjDisplay,
      #stage > div,
      #stage canvas { max-width: 100%; max-height: 100%; }
      #status {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        max-width: 82%;
        text-align: center;
        font-size: 14px;
        line-height: 1.5;
        padding: 12px 16px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid #2a2f4a;
        color: var(--accent);
      }
      #status.error { color: #ff8080; border-color: #5a2a2a; }
      .hint {
        max-width: 760px;
        font-size: 12px;
        opacity: 0.72;
        text-align: center;
        line-height: 1.6;
      }
      .hint kbd {
        background: #232840;
        border: 1px solid #39406a;
        border-bottom-width: 2px;
        border-radius: 5px;
        padding: 1px 6px;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <img src="/icon.png" alt="" width="40" height="40" />
        <div>
          <h1>Heroes Lore: Zero</h1>
          <p>Original J2ME game running in-browser (CheerpJ + MicroEmulator)</p>
        </div>
      </header>

      <div id="stage">
        <div id="status">Loading…</div>
      </div>

      <p class="hint">
        Click the screen to give it focus, then use the on-screen phone keypad or your keyboard.
        <br />
        <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> move ·
        <kbd>Numpad 5</kbd> / <kbd>Enter</kbd> select/fire ·
        number keys map to the phone keypad.
      </p>
    </div>

    <script src="https://cjrtnc.leaningtech.com/3.0/cj3loader.js"></script>
    <script type="module" src="/js/emulator.js"></script>
  </body>
</html>
